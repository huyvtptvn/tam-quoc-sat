<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tam Quốc Sát</title>
<meta name="theme-color" content="#a8281d">
<link rel="manifest" href="/manifest.webmanifest">
<script>
  // Trang chính = màn hình đăng nhập của game (/game.html).
  // Trình khởi động mở "/#admin=<mã>": lưu mã quản trị lại để trang quản trị tự đăng nhập.
  (function () {
    var p = new URLSearchParams(location.hash.slice(1));
    var tok = p.get('admin');
    if (tok) { try { localStorage.setItem('tqs_admin', tok); } catch (e) { /* bị chặn */ } }
    location.replace('/game.html' + (tok ? '' : location.hash));
  })();
</script>
</head>
<body style="background:#142229;color:#efe4cc;font-family:serif">
<noscript>Trình duyệt cần bật JavaScript. <a href="/game.html" style="color:#efe4cc">Vào game</a></noscript>
</body>
</html>
