<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%225%22 fill=%22%23a8281d%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22%23f6e9d2%22 font-family=%22serif%22%3ES%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tam Quốc Sát">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng xếp hạng · Tam Quốc Sát</title>
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/cards.css">
<link rel="stylesheet" href="/ui/game.css">
<link rel="stylesheet" href="/ui/home.css">
<link rel="stylesheet" href="/ui/theme.css">
<style>
  main { max-width: 1000px; margin: 0 auto; padding: 22px 16px 60px; }
  .rk-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .rk-head h1 { margin: 0; font-size: 30px; }
  .rk-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .rk-tabs button { background: none; border: 1px solid var(--rim-dim); border-radius: 1em; padding: 2px 12px; cursor: pointer; color: var(--bone-2); }
  .rk-tabs button.on { color: var(--bone); border-color: var(--act); background: rgba(224,83,63,.12); }
  table.rk { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  table.rk th, table.rk td { padding: 8px 8px; border-bottom: 1px solid rgba(197,152,82,.15); text-align: left; }
  table.rk th { color: var(--bone-2); font-weight: 400; font-size: 12.5px; }
  table.rk .num { text-align: right; font-variant-numeric: tabular-nums; }
  table.rk tr.click { cursor: pointer; }
  table.rk tr.click:hover td { background: rgba(197,152,82,.07); }
  .place { width: 2.5em; font-weight: 700; color: var(--rim); }
  .place.p1 { color: #f0c46a; } .place.p2 { color: #d9d9d9; } .place.p3 { color: #d29a6a; }
  .rank-chip { font-size: 12px; padding: 0 .55em; border-radius: 1em; border: 1px solid var(--rim-dim); color: var(--bone-2); white-space: nowrap; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 12px 0 18px; }
  .stat { background: rgba(0,0,0,.28); border: 1px solid rgba(197,152,82,.18); border-radius: 8px; padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; line-height: 1.2; }
  .stat span { font-size: 12.5px; color: var(--bone-2); }
  .ranks { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--bone-2); margin-top: 10px; }
  .back { margin-bottom: 10px; }
  .hide-sm { }
  @media (max-width: 640px) { .hide-sm { display: none; } table.rk th, table.rk td { padding: 7px 4px; } }
  .match-row td { vertical-align: top; }
  .portrait { --pw: 40px; }

  /* ---------- Giao diện mới ---------- */
  main { max-width: 1080px; }
  .rk-head h1 { font-family: var(--font-script); font-weight: 700; font-size: 44px; line-height: 1.1; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 #3a2208) drop-shadow(0 0 14px rgba(255,190,90,.25)); }
  .rk-tabs button { border-color: rgba(214,170,90,.35); }
  .rk-tabs button.on { color: var(--gold-1); border-color: var(--gold-2); background: rgba(224,180,90,.16); }
  table.rk th, table.rk td { border-bottom-color: rgba(214,170,90,.12); }
  table.rk tr.click:hover td { background: rgba(224,180,90,.08); }
  table.rk tr.me td { background: rgba(224,180,90,.1); }
  .place { font-size: 15px; }
  .rank-chip { border-color: rgba(214,170,90,.4); color: var(--gold-1); background: rgba(224,180,90,.08); }
  .av { flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-weight: 700; color: #2a1a05; background: var(--gold); box-shadow: 0 0 0 2px rgba(0,0,0,.5); }
  .who-cell { display: flex; align-items: center; gap: 10px; }
  /* Bục vinh danh top 3 */
  .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 14px; align-items: end; margin: 6px 0 18px; }
  .pod { position: relative; text-align: center; padding: 18px 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid rgba(214,170,90,.35); cursor: pointer;
    box-shadow: 0 16px 40px rgba(0,0,0,.5); transition: transform .15s; }
  .pod:hover { transform: translateY(-3px); }
  .pod.p1 { padding-top: 30px; border-color: var(--gold-1); box-shadow: 0 0 0 1px rgba(251,231,168,.4), 0 0 34px rgba(224,180,90,.35), 0 16px 40px rgba(0,0,0,.5); }
  .pod .medal { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #2a1a05; }
  .pod.p1 .medal { background: linear-gradient(180deg, #fff1b8, #e0b45a 55%, #9c6a22); width: 40px; height: 40px; top: -20px; font-size: 18px; }
  .pod.p2 .medal { background: linear-gradient(180deg, #ffffff, #c9ced6 55%, #7d838d); }
  .pod.p3 .medal { background: linear-gradient(180deg, #ffd9b3, #c98a52 55%, #7d4f25); }
  .pod .av { width: 58px; height: 58px; font-size: 22px; margin: 0 auto 8px; }
  .pod.p1 .av { width: 72px; height: 72px; font-size: 28px; }
  .pod .nm { font-weight: 700; font-size: 16px; }
  .pod .elo { font-family: var(--font-script); font-weight: 700; font-size: 34px; line-height: 1.1; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pod.p1 .elo { font-size: 42px; }
  .pod small { color: var(--bone-2); }
  /* Trang người chơi */
  .hero-card { position: relative; overflow: hidden; display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; padding: 22px 24px; margin-bottom: 16px;
    border-radius: 16px; border: 1px solid rgba(214,170,90,.45); background: linear-gradient(100deg, rgba(14,18,27,.95) 40%, rgba(14,18,27,.6)); box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  .hero-card .bgart { position: absolute; right: -40px; top: -30px; height: 150%; opacity: .35; z-index: 0; -webkit-mask-image: linear-gradient(90deg, transparent, #000 55%); mask-image: linear-gradient(90deg, transparent, #000 55%); }
  .hero-card > *:not(.bgart) { position: relative; z-index: 1; }
  .hero-card .portrait { --pw: 104px; border-radius: 12px; box-shadow: 0 0 0 2px var(--gold-2), 0 10px 26px rgba(0,0,0,.6); }
  .hero-card h1 { margin: 0; font-family: var(--font-script); font-weight: 700; font-size: 48px; line-height: 1.05; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero-card .sub { color: var(--bone-2); margin-top: 4px; }
  .hero-card .bigelo { text-align: right; }
  .hero-card .bigelo b { display: block; font-size: 46px; line-height: 1; color: var(--gold-1); font-variant-numeric: tabular-nums; }
  .hero-card .bigelo span { color: var(--bone-2); font-size: 13px; }
  .stats { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .stat { background: var(--panel); border-color: rgba(214,170,90,.25); border-radius: 12px; padding: 12px 14px; }
  .stat b { color: var(--gold-1); font-size: 24px; }
  .trend { width: 100%; height: 120px; display: block; }
  .mlist { display: grid; gap: 8px; }
  .mrow { display: grid; grid-template-columns: 64px auto 1fr auto auto; gap: 12px; align-items: center; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,.03);
    border: 1px solid rgba(214,170,90,.14); border-left: 3px solid #6b6458; cursor: pointer; }
  .mrow:hover { background: rgba(224,180,90,.07); }
  .mrow.win { border-left-color: #3fae7f; } .mrow.lose { border-left-color: #c0392b; }
  .mrow .res { font-weight: 700; text-align: center; }
  .mrow.win .res { color: #6fd6a2; } .mrow.lose .res { color: #e8806f; }
  .mrow .gens { display: flex; gap: 3px; } .mrow .gens .portrait { --pw: 34px; border-radius: 5px; }
  .mrow .gens .portrait .kbadge, .mrow .gens .portrait .ntag { display: none; }
  .mrow .sc { text-align: right; font-variant-numeric: tabular-nums; }
  .mrow .sc b { font-size: 16px; }
  @media (max-width: 640px) {
    .podium { gap: 8px; } .pod { padding: 14px 6px 10px; } .pod .nm { font-size: 13px; } .pod .elo { font-size: 26px; } .pod.p1 .elo { font-size: 30px; }
    .pod .av { width: 44px; height: 44px; font-size: 17px; } .pod.p1 .av { width: 54px; height: 54px; }
    .hero-card { grid-template-columns: auto 1fr; padding: 16px; gap: 14px; } .hero-card .bigelo { grid-column: 1 / -1; text-align: left; }
    .hero-card .portrait { --pw: 76px; } .hero-card h1 { font-size: 36px; }
    .mrow { grid-template-columns: 50px minmax(0, 1fr) auto auto; gap: 8px; padding: 8px; } .mrow .gens { display: none; } .mrow b { font-size: 13.5px; } .rk-head h1 { font-size: 34px; }
  }

  /* ---------- Sự kiện ---------- */
  .ev-tab { border-color: var(--gold-2) !important; }
  .ev { margin-bottom: 26px; }
  .ev-banner { position: relative; overflow: hidden; border-radius: 16px; border: 1px solid rgba(214,170,90,.55); min-height: 200px; display: flex; align-items: flex-end;
    background: radial-gradient(120% 120% at 85% 0%, rgba(255,170,80,.25), transparent 60%), linear-gradient(110deg, #0e121b 35%, #2a1d14); box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  .ev-banner img { position: absolute; right: 0; top: -10%; height: 140%; opacity: .75; -webkit-mask-image: linear-gradient(90deg, transparent, #000 45%); mask-image: linear-gradient(90deg, transparent, #000 45%); }
  .ev-txt { position: relative; padding: 22px 26px; max-width: 640px; }
  .ev-txt h2 { margin: 6px 0 4px; font-family: var(--font-script); font-weight: 700; font-size: 40px; line-height: 1.1; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 #3a2208); }
  .ev-txt p { margin: 0 0 10px; color: var(--bone); text-shadow: 0 1px 6px #000; }
  .ev-st { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .ev-st.live { background: #1f9b55; color: #fff; box-shadow: 0 0 12px rgba(80,220,120,.5); } .ev-st.soon { background: #3f6fd6; color: #fff; } .ev-st.end { background: #555; color: #ddd; }
  .ev-time { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
  .ev-time b { font-size: 22px; color: var(--gold-1); font-variant-numeric: tabular-nums; }
  .ev-time small { color: var(--bone-2); }
  .ev-win { margin: 10px 0 0; padding: 10px 14px; border-radius: 10px; background: rgba(224,180,90,.12); border: 1px solid var(--gold-2); }
  .ev-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 16px; margin-top: 14px; }
  .ev-info, .ev-board { background: var(--panel); border: 1px solid rgba(214,170,90,.28); border-radius: 14px; padding: 16px 18px; }
  .ev-info p { margin: 0 0 10px; line-height: 1.6; }
  .ev-info h3, .ev-board h3 { margin: 14px 0 8px; font-size: 16px; color: var(--gold-1); display: flex; justify-content: space-between; align-items: baseline; }
  .ev-board h3 { margin-top: 0; }
  .ev-info ol { margin: 0; padding-left: 20px; line-height: 1.6; }
  .ev-rw { display: grid; gap: 8px; margin-bottom: 10px; }
  .ev-rw .rw { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid rgba(214,170,90,.18); }
  .ev-rw .rw b { display: block; color: var(--gold-1); } .ev-rw .rw small { color: var(--bone-2); }
  .medal { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #2a1a05; }
  .p1 > .medal, .rw.p1 .medal { background: linear-gradient(180deg, #fff1b8, #e0b45a 55%, #9c6a22); }
  .p2 > .medal, .rw.p2 .medal { background: linear-gradient(180deg, #ffffff, #c9ced6 55%, #7d838d); }
  .p3 > .medal, .rw.p3 .medal { background: linear-gradient(180deg, #ffd9b3, #c98a52 55%, #7d4f25); }
  .evpod { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 8px; align-items: end; margin: 18px 0 12px; }
  .evp { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 20px 6px 10px; border-radius: 12px; background: rgba(255,255,255,.04);
    border: 1px solid rgba(214,170,90,.3); cursor: pointer; text-align: center; min-width: 0; }
  .evp b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .evp.p1 { padding-top: 26px; border-color: var(--gold-1); box-shadow: 0 0 22px rgba(224,180,90,.3); }
  .evp .medal { position: absolute; top: -15px; }
  .evp .av { width: 42px; height: 42px; font-size: 17px; } .evp.p1 .av { width: 52px; height: 52px; font-size: 21px; }
  .evp .v { font-family: var(--font-script); font-weight: 700; font-size: 28px; line-height: 1.1; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .evp small { color: var(--bone-2); font-size: 11.5px; }
  .evp.empty { opacity: .5; cursor: default; }
  .ev-me { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 10px 12px; border-radius: 10px; background: rgba(224,180,90,.1); border: 1px dashed var(--gold-2); margin-bottom: 10px; font-size: 13.5px; }
  .ev-me > b { font-size: 22px; color: var(--gold-1); } .ev-me .gold { color: var(--gold-1); }
  @media (max-width: 760px) { .ev-grid { grid-template-columns: 1fr; } .ev-board { order: -1; } .ev-txt h2 { font-size: 30px; } .ev-txt { padding: 16px; } .ev-banner img { opacity: .4; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" title="Về trang chính" style="color:inherit;text-decoration:none"><span class="mark">三国</span><span>Tam Quốc Sát</span></a>
  <nav class="nav-tabs" aria-label="Trang"><a href="/game.html">Phòng</a><a class="on" href="/ranking.html">Xếp hạng</a></nav>
  <span class="spacer"></span>
  <a class="btn small primary" href="/game.html">Vào chơi</a>
</header>
<main>
  <div id="view"></div>
</main>
<script src="/ui/cards.js"></script>
<script>
(function () {
  const C = window.TQSCards;
  const { esc } = C;
  const $ = (id) => document.getElementById(id);
  const CAT = [['damage', 'Sát thương'], ['kill', 'Hạ gục'], ['heal', 'Hồi máu'], ['cards', 'Hủy/lấy bài'], ['hpLoss', 'Làm mất máu'],
    ['jail', 'Tù'], ['control', 'Khống chế'], ['support', 'Hỗ trợ'], ['end', 'Kết thúc ván']];
  const FACTION = (f) => (f === 'careerist' ? 'Dã tâm gia' : f === 'lienquan' ? 'Liên quân' : f === 'boss' ? 'Boss' : C.KINGDOM[f]?.label ?? f);
  /** Thanh chuyển giữa 2 bảng: Quốc Chiến (Elo) và Thảo Phạt (đánh boss). */
  const modeTabs = (on) => `<div class="rk-tabs" style="margin-bottom:12px"><a class="btn small ${on === 'qc' ? 'primary' : 'ghost'}" href="#">Quốc Chiến (Elo)</a><a class="btn small ${on === 'boss' ? 'primary' : 'ghost'}" href="#thao-phat">Thảo Phạt (đánh boss)</a><a class="btn small ${on === 'ev' ? 'primary' : 'ghost'} ev-tab" href="#su-kien">🏆 Sự kiện</a></div>`;
  let bossSel = { boss: '', diff: 'all' };

  async function showBoss() {
    const data = await get(`/api/leaderboard/boss?boss=${encodeURIComponent(bossSel.boss)}&diff=${bossSel.diff}`);
    if (!bossSel.boss) bossSel.boss = data.bosses.list[0]?.id ?? '';
    const bossInfo = data.bosses.list.find((b) => b.id === bossSel.boss);
    const diffs = [{ id: 'all', label: 'Mọi độ khó' }, ...data.bosses.difficulties];
    const fast = data.fastest.map((m) => `<tr class="click" data-m="${esc(m.id)}">
      <td class="place p${m.place}">${m.place}</td>
      <td><b>${m.rounds} vòng</b><br><small class="muted">${esc(m.difficulty)} · ${when(m.at)}</small></td>
      <td>${m.team.map((t) => `${esc(t.name)}${t.username ? ` <small class="muted">@${esc(t.username)}</small>` : ''} <small class="muted">(${esc(t.generals.map(gname).join(' + '))})</small>`).join('<br>')}</td>
    </tr>`).join('');
    const pl = data.players.map((p) => `<tr class="click" data-u="${esc(p.username)}">
      <td class="place p${p.place}">${p.place}</td>
      <td><b>${esc(p.displayName)}</b> <small class="muted">@${esc(p.username)}</small></td>
      <td class="num"><b>${fmt(p.points)}</b></td>
      <td class="num">${p.clears}/${p.plays}</td>
      <td class="num hide-sm">${p.best === null ? '—' : `${p.best} vòng`}</td>
    </tr>`).join('');
    $('view').innerHTML = `${modeTabs('boss')}<div class="rk-head"><h1>Thảo Phạt</h1>
        <select id="bsBoss" class="field" style="width:auto">${data.bosses.list.map((b) => `<option value="${esc(b.id)}" ${b.id === bossSel.boss ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select>
        <div class="rk-tabs">${diffs.map((d) => `<button type="button" data-diff="${esc(d.id)}" class="${d.id === bossSel.diff ? 'on' : ''}">${esc(d.label)}</button>`).join('')}</div></div>
      <p class="muted" style="margin-top:-6px">${esc(bossInfo?.desc ?? '')} Chiến công = điểm trong ván + thưởng hạ boss theo độ khó (${data.bosses.difficulties.map((d) => `${esc(d.label)} +${d.winBonus}`).join(', ')}) + 2 điểm cho mỗi vòng sớm hơn giới hạn.</p>
      <div class="panel" style="margin-bottom:16px"><h2>Đội hạ boss nhanh nhất</h2>
        ${data.fastest.length ? `<table class="rk"><thead><tr><th>#</th><th>Số vòng</th><th>Đội hình</th></tr></thead><tbody>${fast}</tbody></table>` : '<div class="empty">Chưa đội nào hạ được boss này.</div>'}</div>
      <div class="panel"><h2>Người chơi theo Chiến công</h2>
        ${data.players.length ? `<table class="rk"><thead><tr><th>#</th><th>Người chơi</th><th class="num">Chiến công</th><th class="num">Hạ boss</th><th class="num hide-sm">Nhanh nhất</th></tr></thead><tbody>${pl}</tbody></table>` : '<div class="empty">Chưa có ai đánh boss này bằng tài khoản.</div>'}</div>`;
    $('bsBoss').onchange = () => { bossSel.boss = $('bsBoss').value; showBoss(); };
    document.querySelectorAll('[data-diff]').forEach((b) => { b.onclick = () => { bossSel.diff = b.dataset.diff; showBoss(); }; });
    document.querySelectorAll('tr[data-u]').forEach((tr) => { tr.onclick = () => { location.hash = `nguoi-${encodeURIComponent(tr.dataset.u)}`; }; });
    document.querySelectorAll('tr[data-m]').forEach((tr) => { tr.onclick = () => { location.hash = `van-${tr.dataset.m}`; }; });
  }
  const fmt = (x) => (Number.isInteger(x) ? String(x) : x.toFixed(1));
  const when = (iso) => iso ? new Date(iso).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' }) : '—';
  const gname = (id) => C.general(id)?.name ?? id;
  const SORTS = [['rating', 'Elo'], ['wins', 'Số trận thắng'], ['score', 'Điểm TB/ván'], ['mvp', 'Số lần MVP']];
  let sort = 'rating';

  async function get(path) {
    const r = await fetch(path);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Lỗi tải dữ liệu');
    return j;
  }

  async function showBoard() {
    const data = await get(`/api/leaderboard?sort=${sort}`);
    const av = (p) => `<span class="av">${esc([...(p.displayName || p.username)][0].toUpperCase())}</span>`;
    const top = data.players.slice(0, 3);
    const pod = (p) => (p ? `<div class="pod p${p.place}" data-u="${esc(p.username)}"><span class="medal">${p.place}</span>${av(p)}
      <div class="nm">${esc(p.displayName)}</div><small>@${esc(p.username)}</small><div class="elo">${sort === 'rating' ? p.rating : sort === 'wins' ? p.wins : sort === 'mvp' ? p.mvps : fmt(p.avgScore)}</div>
      <span class="rank-chip">${esc(p.rank)}</span><div><small>${p.games} ván · thắng ${p.winRate}%</small></div></div>` : '<div></div>');
    const podium = top.length >= 3 ? `<div class="podium">${pod(top[1])}${pod(top[0])}${pod(top[2])}</div>` : '';
    const rows = data.players.map((p) => `<tr class="click" data-u="${esc(p.username)}">
      <td class="place p${p.place}">${p.place}</td>
      <td><div class="who-cell">${av(p)}<div><b>${esc(p.displayName)}</b> <small class="muted">@${esc(p.username)}</small><br><span class="rank-chip">${esc(p.rank)}</span></div></div></td>
      <td class="num"><b>${p.rating}</b></td>
      <td class="num">${p.games}</td>
      <td class="num hide-sm">${p.wins} <small class="muted">(${p.winRate}%)</small></td>
      <td class="num hide-sm">${p.mvps}</td>
      <td class="num">${fmt(p.avgScore)}</td>
    </tr>`).join('');
    $('view').innerHTML = `${modeTabs('qc')}<div class="rk-head"><h1>Bảng xếp hạng</h1>
      <div class="rk-tabs">${SORTS.map(([k, l]) => `<button type="button" data-sort="${k}" class="${k === sort ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      ${podium}
      <div class="panel">${data.players.length ? `<table class="rk"><thead><tr><th>#</th><th>Người chơi</th><th class="num">Elo</th><th class="num">Ván</th><th class="num hide-sm">Thắng</th><th class="num hide-sm">MVP</th><th class="num">Điểm TB</th></tr></thead><tbody>${rows}</tbody></table>`
        : '<div class="empty">Chưa có ai chơi ván có tài khoản. Đăng nhập ở màn hình vào game rồi chơi một ván để lên bảng.</div>'}
      <div class="ranks">Cấp bậc: <span class="rank-chip">Binh Sĩ &lt; 1000</span>${data.ranks.slice().reverse().map((r) => `<span class="rank-chip">${esc(r.name)} ≥ ${r.min}</span>`).join('')} · 10 ván đầu là "đang xếp hạng".</div></div>`;
    document.querySelectorAll('[data-sort]').forEach((b) => { b.onclick = () => { sort = b.dataset.sort; showBoard(); }; });
    document.querySelectorAll('tr[data-u], .pod[data-u]').forEach((tr) => { tr.onclick = () => { location.hash = `nguoi-${encodeURIComponent(tr.dataset.u)}`; }; });
  }

  /** Đường Elo qua các ván gần nhất (SVG nhỏ). */
  function trendSVG(points) {
    if (points.length < 2) return '';
    const W = 600, H = 120, pad = 10;
    const lo = Math.min(...points), hi = Math.max(...points), span = Math.max(1, hi - lo);
    const xy = points.map((v, i) => [pad + (i * (W - 2 * pad)) / (points.length - 1), H - pad - ((v - lo) * (H - 2 * pad)) / span]);
    const line = xy.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
    const area = `${line} L${xy[xy.length - 1][0].toFixed(1)} ${H - pad} L${pad} ${H - pad} Z`;
    return `<svg class="trend" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Elo các ván gần nhất">
      <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0b45a" stop-opacity=".35"/><stop offset="1" stop-color="#e0b45a" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="#e0b45a" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      ${xy.map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#fbe7a8"/>`).join('')}
      <text x="${W - pad}" y="14" text-anchor="end" fill="#a99d86" font-size="12">${hi}</text><text x="${W - pad}" y="${H - 2}" text-anchor="end" fill="#a99d86" font-size="12">${lo}</text></svg>`;
  }

  async function showProfile(u) {
    const { profile: p, matches } = await get(`/api/profile?u=${encodeURIComponent(u)}`);
    const titles = Object.entries(p.titles).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<span class="title-chip ${t === 'MVP' ? 'mvp' : ''}">${esc(t)} ×${n}</span>`).join(' ');
    // Tướng chơi nhiều nhất làm ảnh đại diện
    const cnt = {};
    for (const m of matches) { const me = m.players.find((x) => x.username === p.username); if (me) cnt[me.generals[0]] = (cnt[me.generals[0]] ?? 0) + 1; }
    const fav = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0]?.[0] ?? null;
    const favImg = fav ? C.generalImage(fav) : null;
    const elo = matches.slice().reverse().map((m) => m.players.find((x) => x.username === p.username)?.ratingAfter).filter((v) => typeof v === 'number');
    const rows = matches.map((m) => {
      const me = m.players.find((x) => x.username === p.username);
      const d = me.ratingAfter !== null && me.ratingBefore !== null ? me.ratingAfter - me.ratingBefore : null;
      return `<div class="mrow ${me.winner ? 'win' : 'lose'}" data-m="${esc(m.id)}">
        <div class="res">${me.winner ? 'Thắng' : 'Thua'}${me.titles.includes('MVP') ? '<br><span class="title-chip mvp">MVP</span>' : ''}</div>
        <div class="gens">${me.generals.map((g) => C.portraitHTML(g, { noTitle: true })).join('')}</div>
        <div><b>${esc(me.generals.map(gname).join(' + '))}</b> <small class="muted">· ${esc(FACTION(me.faction))}</small><br>
          <small class="muted">${when(m.at)} · ${m.boss ? `Thảo Phạt ${esc(m.boss.name)} (${esc(m.boss.difficultyLabel)}) · ${m.boss.rounds} vòng` : `${m.players.length} người · ${m.turns} lượt`}</small></div>
        <div class="sc"><b>${fmt(me.score)}</b><br><small class="muted">điểm</small></div>
        <div class="sc">${d === null ? '<span class="muted">—</span>' : `<b class="${d >= 0 ? 'elo-up' : 'elo-down'}">${d >= 0 ? '+' : ''}${d}</b><br><small class="muted">${me.ratingAfter}</small>`}</div>
      </div>`;
    }).join('');
    $('view').innerHTML = `<div class="back"><a class="btn small ghost" href="#">← Bảng xếp hạng</a></div>
      <section class="hero-card">${favImg ? `<img class="bgart" src="${esc(favImg)}" alt="">` : ''}
        ${fav ? C.portraitHTML(fav, { noTitle: true }) : `<span class="av" style="width:104px;height:104px;font-size:44px">${esc([...p.displayName][0].toUpperCase())}</span>`}
        <div><h1>${esc(p.displayName)}</h1><div class="sub">@${esc(p.username)} · <span class="rank-chip">${esc(p.rank)}</span>${fav ? ` · Tướng tủ: <b>${esc(gname(fav))}</b>` : ''}</div>
          ${titles ? `<div class="titles" style="margin-top:8px">${titles}</div>` : ''}</div>
        <div class="bigelo"><b>${p.rating}</b><span>Elo · cao nhất ${p.peak}</span></div>
      </section>
      <div class="stats">
        <div class="stat"><b>${p.games}</b><span>Ván đã chơi</span></div>
        <div class="stat"><b>${p.winRate}%</b><span>Tỉ lệ thắng (thắng ${p.wins}/${p.games})</span></div>
        <div class="stat"><b>${p.mvps}</b><span>Lần MVP</span></div>
        <div class="stat"><b>${fmt(p.avgScore)}</b><span>Điểm TB/ván</span></div>
        <div class="stat"><b>${fmt(p.bestScore)}</b><span>Điểm cao nhất</span></div>
        <div class="stat"><b>${fmt(p.boss?.points ?? 0)}</b><span>Chiến công Thảo Phạt (hạ boss ${p.boss?.clears ?? 0}/${p.boss?.plays ?? 0})</span></div>
      </div>
      ${elo.length > 1 ? `<div class="panel" style="margin-bottom:16px"><h2>Elo qua ${elo.length} ván gần nhất</h2>${trendSVG(elo)}</div>` : ''}
      <div class="panel"><h2>20 ván gần nhất</h2>
      ${matches.length ? `<div class="mlist">${rows}</div>` : '<div class="empty">Chưa có ván nào.</div>'}</div>`;
    document.querySelectorAll('[data-m]').forEach((tr) => { tr.onclick = () => { location.hash = `van-${tr.dataset.m}`; }; });
  }

  async function showMatch(id) {
    const m = await get(`/api/match?id=${encodeURIComponent(id)}`);
    const rows = [...m.players].sort((a, b) => b.score - a.score).map((p) => {
      const d = p.ratingAfter !== null && p.ratingBefore !== null ? p.ratingAfter - p.ratingBefore : null;
      const detail = CAT.filter(([k]) => p.breakdown[k]).map(([k, l]) => `${l} ${p.breakdown[k] > 0 ? '+' : ''}${fmt(p.breakdown[k])}`).join(' · ');
      return `<tr class="${p.winner ? 'win' : ''}">
        <td>${C.portraitHTML(p.generals[0])}</td>
        <td><b>${esc(p.name)}</b> ${p.username ? `<a class="muted" href="#nguoi-${encodeURIComponent(p.username)}">@${esc(p.username)}</a>` : `<small class="muted">${p.bot ? 'bot' : 'khách'}</small>`}${p.alive ? '' : ' <span class="muted">✝</span>'}<br>
          <small class="muted">${esc(p.generals.map(gname).join(' + '))} · ${esc(FACTION(p.faction))}${p.winner ? ' · <b>Thắng</b>' : ''}</small>
          <div class="titles">${p.titles.map((t) => `<span class="title-chip ${t === 'MVP' ? 'mvp' : ''}">${esc(t)}</span>`).join('')}</div>
          <div class="score-detail">${esc(detail)}</div></td>
        <td class="num total">${fmt(p.score)}</td>
        <td class="num">${d === null ? '<span class="muted">—</span>' : `${p.ratingAfter}<br><small class="${d >= 0 ? 'elo-up' : 'elo-down'}">${d >= 0 ? '+' : ''}${d}</small>`}</td>
      </tr>`;
    }).join('');
    $('view').innerHTML = `<div class="back"><a class="btn small ghost" href="javascript:history.back()">← Quay lại</a></div>
      <div class="rk-head"><h1>Ván ${esc(m.id)}</h1><span class="muted">${when(m.at)} · ${esc(m.room)} · ${m.turns} lượt · ${esc(m.winner ? `${m.winner} thắng` : 'Hòa')}${m.ranked ? ' · có tính Elo' : ''}</span></div>
      <div class="panel"><table class="score-table"><thead><tr><th></th><th>Người chơi</th><th class="num">Điểm</th><th class="num">Elo</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }


  // ---------------- Sự kiện ----------------
  const authHdr = () => { let t = ''; try { t = sessionStorage.getItem('tqs_auth') || localStorage.getItem('tqs_login') || ''; } catch { /* chặn */ } return t ? { 'x-account-token': t } : {}; };
  let evTimer = 0;
  const dmy = (iso) => new Date(iso).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  function left(ms) {
    if (ms <= 0) return 'Đã kết thúc';
    const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, sec = Math.floor(ms / 1e3) % 60;
    return `${d ? `${d} ngày ` : ''}${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }
  async function showEvents(focus) {
    const r = await fetch('/api/events', { headers: authHdr() });
    const data = await r.json();
    const skew = Date.parse(data.now) - Date.now();
    const av = (n) => `<span class="av">${esc([...(n || '?')][0].toUpperCase())}</span>`;
    const val = (ev, v) => (ev.kind === 'elo' ? `${v}` : fmt(v));
    const unit = (ev) => (ev.kind === 'elo' ? 'Elo' : 'điểm');
    const card = (ev) => {
      const st = { live: ['Đang diễn ra', 'live'], upcoming: ['Sắp diễn ra', 'soon'], ended: ['Đã kết thúc', 'end'] }[ev.status];
      const top = ev.standings.slice(0, 3);
      const pod = (p, i) => (p ? `<div class="evp p${p.place}" data-u="${esc(p.username)}"><span class="medal">${p.place}</span>${av(p.displayName)}<b>${esc(p.displayName)}</b><span class="v">${val(ev, p.value)}</span><small>${unit(ev)}</small></div>`
        : `<div class="evp p${i + 1} empty"><span class="medal">${i + 1}</span><span class="av">?</span><b>Còn trống</b><small>chờ người tranh</small></div>`);
      const rows = ev.standings.slice(3).map((p) => `<tr class="click ${ev.me?.username === p.username ? 'me' : ''}" data-u="${esc(p.username)}"${ev.kind === 'bestScore' && p.matchId ? ` data-m="${esc(p.matchId)}"` : ''}>
        <td class="place">${p.place}</td><td><div class="who-cell">${av(p.displayName)}<div><b>${esc(p.displayName)}</b> <small class="muted">@${esc(p.username)}</small></div></div></td>
        <td class="num"><b>${val(ev, p.value)}</b></td><td class="num hide-sm">${ev.kind === 'elo' ? `${p.games} ván · ${p.wins} thắng` : esc((p.generals || []).map(gname).join(' + '))}</td></tr>`).join('');
      const me = ev.me;
      const myBox = !me ? `<div class="ev-me muted">Đăng nhập tài khoản ở màn hình vào game để tham gia và xem vị trí của bạn.</div>`
        : me.row ? `<div class="ev-me"><span>Vị trí của bạn</span><b>#${me.row.place}</b><span>${val(ev, me.row.value)} ${unit(ev)}${me.row.place <= 3 ? ' · <b class="gold">đang trong top nhận thưởng!</b>' : top[2] ? ` · cần vượt ${val(ev, top[2].value)} để vào top 3` : ''}</span></div>`
        : `<div class="ev-me"><span>Vị trí của bạn</span><b>—</b><span>${ev.kind === 'elo' ? `Đã chơi ${me.games}/${ev.minGames} ván có tính Elo — chơi thêm ${Math.max(0, ev.minGames - me.games)} ván để lên bảng.` : 'Chưa có ván đủ điều kiện. Chơi một ván Quốc Chiến từ 5 người trở lên để ghi điểm.'}</span></div>`;
      const winners = ev.winners ? `<div class="ev-win">🏆 Đã trao thưởng: ${ev.winners.map((w) => `#${w.place} <b>@${esc(w.username)}</b> — ${esc(w.title)}`).join(' · ')}</div>` : '';
      return `<section class="ev" id="ev-${esc(ev.id)}">
        <div class="ev-banner">${ev.art ? `<img src="${esc(ev.art)}" alt="" onerror="this.remove()">` : ''}
          <div class="ev-txt"><span class="ev-st ${st[1]}">${st[0]}</span><h2>${esc(ev.name)}</h2><p>${esc(ev.tagline)}</p>
            <div class="ev-time"><span>⏳ <b class="cd" data-end="${esc(ev.end)}" data-start="${esc(ev.start)}">${ev.status === 'upcoming' ? `Bắt đầu sau ${left(Date.parse(ev.start) - Date.now() - skew)}` : left(Date.parse(ev.end) - Date.now() - skew)}</b></span>
              <small>${dmy(ev.start)} → ${dmy(ev.end)}</small></div></div></div>
        ${winners}
        <div class="ev-grid">
          <div class="ev-info">
            ${ev.intro.map((t) => `<p>${esc(t)}</p>`).join('')}
            <h3>Thể lệ</h3><ol>${ev.rules.map((t) => `<li>${esc(t)}</li>`).join('')}</ol>
            <h3>Phần thưởng</h3><div class="ev-rw">${ev.rewards.map((w) => `<div class="rw p${w.place}"><span class="medal">${w.place}</span><div><b>${esc(w.title)}</b><small>${esc(w.text)}</small></div></div>`).join('')}</div>
            <p class="muted" style="font-size:12.5px">Danh hiệu được trao tự động ngay khi sự kiện kết thúc và hiện trên trang cá nhân, bảng xếp hạng.</p>
          </div>
          <div class="ev-board">
            <h3>Bảng xếp hạng sự kiện <small class="muted">${ev.total} người</small></h3>
            <div class="evpod">${pod(top[1], 1)}${pod(top[0], 0)}${pod(top[2], 2)}</div>
            ${myBox}
            ${rows ? `<table class="rk"><tbody>${rows}</tbody></table>` : ''}
          </div>
        </div>
      </section>`;
    };
    $('view').innerHTML = `${modeTabs('ev')}<div class="rk-head"><h1>Sự kiện</h1></div>${data.events.map(card).join('')}`;
    document.querySelectorAll('[data-u]').forEach((el) => { el.onclick = (e) => { if (el.dataset.m && !e.target.closest('.who-cell')) location.hash = `van-${el.dataset.m}`; else location.hash = `nguoi-${encodeURIComponent(el.dataset.u)}`; }; });
    clearInterval(evTimer);
    evTimer = setInterval(() => {
      if (!document.querySelector('.cd')) { clearInterval(evTimer); return; }
      document.querySelectorAll('.cd').forEach((el) => {
        const now = Date.now() + skew;
        el.textContent = now < Date.parse(el.dataset.start) ? `Bắt đầu sau ${left(Date.parse(el.dataset.start) - now)}` : left(Date.parse(el.dataset.end) - now);
      });
    }, 1000);
    if (focus) document.getElementById(`ev-${focus}`)?.scrollIntoView();
  }

  async function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    try {
      if (h.startsWith('nguoi-')) await showProfile(h.slice(6));
      else if (h.startsWith('van-')) await showMatch(h.slice(4));
      else if (h.startsWith('thao-phat')) await showBoss();
      else if (h.startsWith('su-kien')) await showEvents(h.slice(8));
      else await showBoard();
    } catch (e) {
      $('view').innerHTML = `<div class="back"><a class="btn small ghost" href="#">← Bảng xếp hạng</a></div><div class="panel"><div class="empty">${esc(e.message)}</div></div>`;
    }
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  (async () => {
    try { C.setCatalog(await (await fetch('/api/catalog')).json()); } catch { /* vẫn hiện bảng, thiếu tên tướng */ }
    try { C.setSkins((await (await fetch('/api/skins')).json()).skins); } catch { /* không có skin */ }
    route();
  })();
})();
</script>
</body>
</html>
