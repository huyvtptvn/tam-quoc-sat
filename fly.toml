# ============================================================
# Cấu hình Fly.io cho Tam Quốc Sát (xem DEPLOY.md, mục "Fly.io").
# Đổi `app` thành tên bạn đặt khi chạy `fly launch --no-deploy` (tên này là phần đầu của địa chỉ <app>.fly.dev).
# ============================================================
app = "tam-quoc-sat"
primary_region = "sin"   # Singapore: gần Việt Nam nhất

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  BOT_DELAY_MS = "2500"
  NODE_ENV = "production"

# Ổ đĩa lưu tài khoản, Elo, lịch sử ván (accounts.json, matches.jsonl). Tạo bằng:
#   fly volumes create tqs_data --region sin --size 1
[[mounts]]
  source = "tqs_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Game giữ phòng và ván đang chơi trong bộ nhớ: KHÔNG cho máy tự tắt khi vắng người
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/status"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
